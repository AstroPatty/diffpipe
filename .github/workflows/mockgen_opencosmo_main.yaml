name: Test diffpipe works with make_lj_mock.py

on:
  workflow_dispatch: null
  schedule:
    # Runs "every Monday & Thursday at 3:05am Central"
    - cron: '5 8 * * 1,4'
  push:
    branches:
      - main
  pull_request: null

jobs:
  mock-generation:
    name: python make_lj_mock.py testing_lj_mock_config.yaml
    runs-on: "ubuntu-latest"

    steps:
      - name: free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          rm_cmd: "rmz"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: 3.12
          channels: conda-forge
          channel-priority: strict
          show-channel-urls: true
          miniforge-version: latest

      - name: configure conda and install code
        shell: bash -l {0}

        run: |
          conda config --set always_yes yes
          conda install --quiet \
            pip \
            setuptools \
            "setuptools_scm>=7,<8" \
            matplotlib \
            astropy \
            h5py \
            mpi4py \
            mpich \
            opencosmo \
            diffmah \
            diffhalos \
            diffstar \
            dsps \
            diffhalos \
            diffsky
          conda uninstall diffmah --force
          conda uninstall diffstar --force
          conda uninstall dsps --force
          conda uninstall diffhalos --force
          conda uninstall diffsky --force
          pip install --no-deps --no-build-isolation git+https://github.com/ArgonneCPAC/diffmah.git
          pip install --no-deps --no-build-isolation git+https://github.com/ArgonneCPAC/diffstar.git
          pip install --no-deps --no-build-isolation git+https://github.com/ArgonneCPAC/dsps.git
          pip install --no-deps --no-build-isolation git+https://github.com/ArgonneCPAC/diffhalos.git
          pip install --no-deps --no-build-isolation git+https://github.com/ArgonneCPAC/diffsky.git

          pip install git+https://github.com/ArgonneCPAC/opencosmo.git
          python -m pip install .
      - name: download dsps data
        timeout-minutes: 5
        shell: bash -l {0}
        run: |
          WGET_OPTS="-4 --tries=3 --timeout=30 --waitretry=5 --retry-connrefused"

          # Create data directory
          mkdir -p dsps_drn/filters

          # Download data
          cd dsps_drn
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/ssp-data-v1/fsps_v0.4.7_mist_c3k_a_kroupa_wNE_logGasU-2.0_logGasZ0.0.sparse.h5

          cd filters
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_u_transmission.h5
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_g_transmission.h5
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_r_transmission.h5
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_i_transmission.h5
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_z_transmission.h5
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_y_transmission.h5
          cd ..
          cd ..

          # download lc_cores-decomposition.txt
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/hacc-data-lastjourney-v1/lc_cores-decomposition.txt

          # Set environment variable
          export DSPS_DRN="${GITHUB_WORKSPACE}/dsps_drn"
          echo "DSPS_DRN=${DSPS_DRN}" >> $GITHUB_ENV

      - name: create mock with cosmos_fit option
        shell: bash -l {0}
        run: |
          git clone https://github.com/ArgonneCPAC/diffsky.git

          # Create output directory
          mkdir -p ci_test_output

          # Run mock production script
          mpiexec -n 1 python diffsky/scripts/LJ_LC_MOCKS/make_lj_mock.py diffsky/scripts/LJ_LC_MOCKS/testing_lj_mock_config.yaml

          mv lc_cores-decomposition.txt ci_test_output/dummy_version_name/

      - name: verify script completed
        shell: bash -l {0}
        run: |
          echo "make_lj_mock.py ran successfully for testing_lj_mock_config.yaml"

      - name: validate mock
        shell: bash -l {0}
        run: |
          python diffsky/scripts/LJ_LC_MOCKS/inspect_lc_mock.py diffsky/scripts/LJ_LC_MOCKS/testing_lj_mock_config.yaml

      - name: Create dummy diffsky galaxies for OpenCosmo
        shell: bash -l {0}
        run: |
          python diffsky/scripts/LJ_LC_MOCKS/create_dummy_mock_data.py ci_test_output/dummy_version_name

      - name: OpenCosmo toolkit data conversion (with synthetic halos)
        shell: bash -l {0}
        run: |
          mkdir -p ci_test_output/oc_dummy_version_name
          cp ci_test_output/dummy_version_name/* ci_test_output/oc_dummy_version_name/
          rm -rf ci_test_output/oc_dummy_version_name/lc_cores*.hdf5
          diffpipe run ci_test_output/dummy_version_name ci_test_output/oc_dummy_version_name -n 2

      # Emit both schemas as artifacts *before* the no-synthetics step below
      # mutates the input catalog, so the property test suite receives a
      # complete, matched input/output pair.
      - name: Upload diffsky input catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: diffsky-input-catalog
          path: ci_test_output/dummy_version_name
          if-no-files-found: error

      - name: Upload OpenCosmo output catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencosmo-output-catalog
          path: ci_test_output/oc_dummy_version_name
          if-no-files-found: error

      - name: OpenCosmo toolkit data conversion (no synthetic halos)
        shell: bash -l {0}
        run: |
          mkdir -p ci_test_output/oc_dummy_version_name_no_synthetics
          cp ci_test_output/dummy_version_name/* ci_test_output/oc_dummy_version_name_no_synthetics/
          rm -rf ci_test_output/oc_dummy_version_name_no_synthetics/lc_cores*.hdf5
          rm -rf ci_test_output/dummy_version_name/lc_cores-*.synthetic_halos.hdf5
          diffpipe run ci_test_output/dummy_version_name ci_test_output/oc_dummy_version_name_no_synthetics -n 2

      - name: Clean up mock data
        shell: bash -l {0}
        run: |
          rm -rf ci_test_output

  property-tests:
    name: pytest property test suite
    needs: mock-generation
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download diffsky input catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: diffsky-input-catalog
          path: test-data/input

      - name: Download OpenCosmo output catalog artifact
        uses: actions/download-artifact@v4
        with:
          name: opencosmo-output-catalog
          path: test-data/output

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest h5py numpy opencosmo

      - name: Run property test suite
        env:
          DIFFPIPE_TEST_DATA_DIR: ${{ github.workspace }}/test-data
        run: |
          pytest tests -v

